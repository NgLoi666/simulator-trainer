name: Build (macOS Intel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build simulator-trainer (x86_64, Xcode 26.3)
    # Self-hosted runner registered on your Intel Mac (macOS 15.7.5, Xcode 26.3)
    runs-on: [self-hosted, macos, x86_64]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Build (Release, x86_64)
        run: |
          xcodebuild \
            -project simulator-trainer.xcodeproj \
            -scheme simulator-trainer \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate built app
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "simulator-trainer.app" | head -1)
          echo "App: $APP"
          ls -la "$APP/Contents/MacOS"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-trainer-macos-intel
          path: build/Build/Products/Release/simulator-trainer.app
